version: '3.9'

# Perfil de desarrollo con servicios adicionales
# Usar: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  ollama:
    image: ollama/ollama:latest
    container_name: soctriaje-ollama
    profiles: ["with-ollama"]
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    command: serve
    networks:
      - soc-network
    restart: unless-stopped
    # Para descargar el modelo al iniciar (opcional):
    # entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 10 && ollama pull llama3 && wait"]

  mock-ticketing:
    image: mockserver/mockserver:latest
    container_name: soctriaje-mock-ticketing
    profiles: ["dev"]
    environment:
      MOCKSERVER_PROPERTY_FILE: /config/mockserver.properties
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/initializerJson.json
    volumes:
      - ./scripts/mock-ticketing-expectations.json:/config/initializerJson.json:ro
    ports:
      - "1080:1080"
    networks:
      - soc-network
    restart: unless-stopped

  # PostgreSQL con configuración de desarrollo (más logs)
  postgres:
    environment:
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=es_MX.UTF-8"
    command: 
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_duration=on"

  # Backend con hot-reload
  backend:
    volumes:
      - ./backend/app:/app/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DEBUG: "true"

  # AI service con hot-reload
  ai-service:
    volumes:
      - ./ai-service/app:/app/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      DEBUG: "true"

  # Frontend con Vite dev server (hot-reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1

volumes:
  ollama_models:
    name: soctriaje-ollama-models

networks:
  soc-network:
    external: true
